name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    if: github.event_name != 'pull_request'
    environment: ci
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Catapult-CN v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $zipName = "Catapult-CN_${{ github.ref_name }}_x64.zip"
          $portableDir = "Catapult-CN"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item "$releaseDir/catapult.exe" $portableDir/
          Copy-Item "$releaseDir/*.dll" $portableDir/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse "$releaseDir/resources" $portableDir/ -ErrorAction SilentlyContinue
          Compress-Archive -Path $portableDir -DestinationPath $zipName -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Upload portable ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.build.outputs.releaseUploadUrl }}
          asset_path: ./Catapult-CN_${{ github.ref_name }}_x64.zip
          asset_name: Catapult-CN_${{ github.ref_name }}_x64.zip
          asset_content_type: application/zip
