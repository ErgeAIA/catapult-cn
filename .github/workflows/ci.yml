name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    environment: ci
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Catapult-CN v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "src-tauri/target/release"
          $dst = "Catapult-CN-portable"
          New-Item -ItemType Directory -Force -Path $dst
          Copy-Item "$src/catapult.exe" "$dst/Catapult-CN.exe"
          Copy-Item "$src/*.dll" $dst/
          $zipName = "Catapult-CN-$version-portable.zip"
          Compress-Archive -Path $dst -DestinationPath $zipName
          echo "portable_zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload portable zip to Release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $file = "Catapult-CN-$version-portable.zip"
          gh release upload $version $file --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-gitee:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ergeaia/catapult-cn.git
          git push gitee ${{ github.ref }} --force
          if [[ '${{ github.ref }}' == refs/tags/* ]]; then
            git push gitee ${{ github.ref_name }} --force
          fi

  sync-release-to-gitee:
    needs: [build, sync-to-gitee]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Release Info
        id: release
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          gh release view ${{ github.ref_name }} --json body,isPrerelease --jq '{body: .body, prerelease: .prerelease}' > release.json
          cat release.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Assets
        run: |
          mkdir -p assets
          gh release download ${{ github.ref_name }} --dir ./assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Gitee Release
        id: gitee_release
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(cat release.json | jq -r '.body')
          PRERELEASE=$(cat release.json | jq -r '.prerelease')

          RESPONSE=$(curl -s -X POST \
            'https://gitee.com/api/v5/repos/ergeaia/catapult-cn/releases' \
            -H 'Authorization: token ${{ secrets.GITEE_ACCESS_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"Catapult-CN $TAG\",
              \"body\": $(echo "$BODY" | jq -Rs .),
              \"prerelease\": $PRERELEASE,
              \"target_commitish\": \"master\"
            }")

          echo "Release Response: $RESPONSE"
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "::error::Failed to create Gitee release: $RESPONSE"
            exit 1
          fi

      - name: Upload Assets to Gitee
        run: |
          RELEASE_ID=${{ steps.gitee_release.outputs.release_id }}
          for file in assets/*; do
            FILENAME=$(basename "$file")
            echo "Uploading: $FILENAME"
            RESPONSE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/ergeaia/catapult-cn/releases/$RELEASE_ID/attach_files" \
              -H 'Authorization: token ${{ secrets.GITEE_ACCESS_TOKEN }}' \
              -F "file=@$file;filename=$FILENAME")
            echo "$RESPONSE"
          done
