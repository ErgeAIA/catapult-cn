name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    environment: ci
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Catapult-CN v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "src-tauri/target/release"
          $dst = "Catapult-CN-portable"
          New-Item -ItemType Directory -Force -Path $dst
          Copy-Item "$src/catapult.exe" "$dst/Catapult-CN.exe"
          Copy-Item "$src/*.dll" $dst/
          $zipName = "Catapult-CN-$version-portable.zip"
          Compress-Archive -Path $dst -DestinationPath $zipName
          echo "portable_zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload portable zip to Release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $file = "Catapult-CN-$version-portable.zip"
          gh release upload $version $file --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-gitee:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://ergeaia:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ergeaia/catapult-cn.git
          git push gitee ${{ github.ref }} --force

  sync-release-to-gitee:
    needs: [build, sync-to-gitee]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Release Info
        id: release
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          gh release view ${{ github.ref_name }} --json body,isPrerelease --jq '{body: .body, prerelease: .prerelease}' > release.json
          cat release.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Assets
        run: |
          mkdir -p assets
          gh release download ${{ github.ref_name }} --dir ./assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Gitee Token
        run: |
          TOKEN="${{ secrets.GITEE_ACCESS_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::GITEE_ACCESS_TOKEN secret is empty"
            exit 1
          fi
          echo "Token length: ${#TOKEN}"
          RESPONSE=$(curl -s "https://gitee.com/api/v5/user?access_token=$TOKEN")
          echo "Token verification: $RESPONSE"
          echo "$RESPONSE" | jq -e '.login' > /dev/null
          if [ $? -ne 0 ]; then
            echo "::error::Gitee token verification failed. Token needs at least 'projects' (user_info) permission."
            echo "Please regenerate token at: https://gitee.com/profile/personal_access_tokens"
            exit 1
          fi

      - name: Create Gitee Release
        id: gitee_release
        run: |
          TAG="${{ github.ref_name }}"
          TOKEN="${{ secrets.GITEE_ACCESS_TOKEN }}"

          jq -r '.body // empty' release.json > body.txt
          if [ ! -s body.txt ]; then
            printf 'Release %s' "$TAG" > body.txt
          fi
          PRERELEASE_VAL=$(jq -r '.prerelease // "false"' release.json)
          # Convert to proper JSON boolean for argjson
          if [ "$PRERELEASE_VAL" = "true" ]; then
            PRERELEASE_JSON="true"
          else
            PRERELEASE_JSON="false"
          fi

          # Build payload with access_token in body (Gitee required format)
          jq -n \
            --arg tag "$TAG" \
            --arg name "Catapult-CN $TAG" \
            --rawfile body body.txt \
            --argjson prerelease "$PRERELEASE_JSON" \
            --arg token "$TOKEN" \
            '{access_token: $token, tag_name: $tag, name: $name, body: ($body | rtrimstr("\n")), prerelease: $prerelease, target_commitish: "master"}' > payload.json

          echo "Payload (token masked):"
          jq 'del(.access_token)' payload.json

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/ergeaia/catapult-cn/releases" \
            -H 'Content-Type: application/json' \
            -d @payload.json)

          # Parse response body and HTTP status
          RELEASE_BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')
          echo "Response: $RELEASE_BODY"
          RELEASE_ID=$(echo "$RELEASE_BODY" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "::warning::Gitee release creation returned no id, checking if release already exists..."
            EXISTING=$(curl -s "https://gitee.com/api/v5/repos/ergeaia/catapult-cn/releases/tags/$TAG?access_token=$TOKEN")
            echo "Existing release check: $EXISTING"
            EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')
            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "release_id=$EXISTING_ID" >> $GITHUB_OUTPUT
            else
              echo "::error::Gitee release creation failed. Full response: $RESPONSE"
              exit 1
            fi
          fi

      - name: Upload Assets to Gitee
        run: |
          RELEASE_ID=${{ steps.gitee_release.outputs.release_id }}
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No Gitee release ID available"
            exit 1
          fi
          TOKEN="${{ secrets.GITEE_ACCESS_TOKEN }}"
          echo "Uploading assets to Gitee release $RELEASE_ID"
          ls -la assets/
          for file in assets/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -X POST \
                "https://gitee.com/api/v5/repos/ergeaia/catapult-cn/releases/$RELEASE_ID/attach_files" \
                -F "access_token=$TOKEN" \
                -F "file=@$file;filename=$FILENAME")
              echo "$RESPONSE"
            fi
          done
