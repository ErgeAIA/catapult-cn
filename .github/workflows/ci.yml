name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    environment: ci
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Catapult-CN v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "src-tauri/target/release"
          $dst = "Catapult-CN-portable"
          New-Item -ItemType Directory -Force -Path $dst
          Copy-Item "$src/catapult.exe" $dst/
          Copy-Item "$src/*.dll" $dst/
          $zipName = "Catapult-CN-$version-portable.zip"
          Compress-Archive -Path $dst -DestinationPath $zipName
          echo "portable_zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload portable zip to Release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $file = "Catapult-CN-$version-portable.zip"
          gh release upload $version $file --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
